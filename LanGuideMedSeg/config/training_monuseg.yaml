TRAIN:
  train_batch_size: 32
  lr: 0.0003

  valid_batch_size: 8

  image_size: [224,224]

  min_epochs: 20
  max_epochs: 100
  patience: 20

  device: 1

  model_save_path: ./text_model
  model_save_filename: medseg

MODEL:
  bert_type: bert-base-uncased
  vision_type: facebook/convnext-tiny-224
  project_dim: 768

DATA:
  train_csv_path: ./MoNuSeg/train_annotations.csv
  train_root_path: ./MoNuSeg/train

  test_csv_path: ./MoNuSeg/val_annotations.csv
  test_root_path: ./MoNuSeg/val